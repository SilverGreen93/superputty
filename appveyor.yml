image: Visual Studio 2026

# SuperPutty.csproj builds putty-embed.dll from the putty submodule with CMake
# (see the BuildPuttyEmbed target), and AppVeyor does not fetch submodules on
# its own, so they must be checked out before msbuild runs. CMake is preinstalled
# on the Visual Studio images.
before_build:
  - git submodule update --init
  - dotnet restore

build_script:
  - msbuild SuperPutty/SuperPutty.csproj /p:Configuration=Release

